name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

# One release at a time per ref; a manual run never cancels a tag release.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

# Least privilege by default: only the two build jobs that publish/attest
# get write scopes (below). A manual dispatch therefore cannot publish —
# its release/attest steps are also tag-gated.
permissions:
  contents: read

jobs:
  # CLI: test, pack the npm tarball, create the release with it.
  cli:
    name: CLI tarball ${{ github.ref_name }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci --omit=dev
      - run: npm test
      - name: Build the publishable tarball
        run: |
          set -x
          node --version && npm --version
          mkdir -p rel
          npm pack --pack-destination rel
          ls -la rel
      - name: Generate SHA256SUMS for tarball
        run: |
          set -x
          ls -lh rel/
          sha256sum rel/*.tgz > rel/SHA256SUMS && cat rel/SHA256SUMS
          ls -lh rel/
      - name: Attest tarball provenance (SLSA L2)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: rel/*
      - name: Extract changelog for this tag
        run: |
          TAG=${GITHUB_REF#refs/tags/}
          TAG=${TAG#v}
          awk -v tag="## [$TAG]" 'index($0, tag) {p=1; next} /^## \[/ {p=0} p' CHANGELOG.md > /tmp/notes.md
          echo "--- Notes for $TAG ---"; cat /tmp/notes.md
          test -s /tmp/notes.md || echo "No changelog entry for $TAG" > /tmp/notes.md
      - name: Create the GitHub release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          files: rel/*
          body_path: /tmp/notes.md
          generate_release_notes: false

  # Desktop app: Tauri bundles (AppImage first). Built on ubuntu-22.04 so the
  # AppImage links against an older glibc and runs on most distributions.
  gui:
    name: GUI bundles ${{ github.ref_name }}
    runs-on: ubuntu-22.04
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      # Dev deps are needed here: @tauri-apps/cli drives the build.
      - run: npm ci
      - run: npm run build:gui
      - name: Install Tauri system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf \
            file
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
      - uses: swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          workspaces: src-tauri
      # Ship a Node runtime inside the packages so end users need nothing
      # on their PATH (lib.rs resolves <resources>/runtime/node first).
      # Pinned LTS 22.x, hash-checked by the shared script (same command a
      # local `tauri build` uses — see docs/RELEASING.md).
      - name: Bundle the Node runtime into the packages
        run: node scripts/fetch-node-runtime.mjs
      - name: Verify the updater signing key is configured
        env:
          KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        run: |
          if [ -z "$KEY" ]; then
            echo "::error::TAURI_SIGNING_PRIVATE_KEY secret is not set — auto-update artifacts cannot be signed. See docs/RELEASING.md (Auto-update)."
            exit 1
          fi
      - name: Build Tauri bundles (appimage, deb, rpm)
        run: npx tauri build --bundles appimage,deb,rpm
        env:
          # Run linuxdeploy without FUSE — removes runner-to-runner variance.
          APPIMAGE_EXTRACT_AND_RUN: "1"
          # Signing the updater artifacts (.sig) — required because
          # bundle.createUpdaterArtifacts is on. The key is generated once with
          # `npx tauri signer generate` and stored as a repo secret.
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
      # AppImageHub (and other catalogs) expect <repo>-<version>-<arch>.AppImage,
      # so rename Tauri's "<Product>_<version>_<arch>.AppImage" before the
      # manifest is built — latest.json and the .sig follow the new name.
      - name: Rename the AppImage to the catalog convention
        run: |
          set -euo pipefail
          VER=${GITHUB_REF#refs/tags/}; VER=${VER#v}
          ARCH=$(uname -m)   # x86_64 on the ubuntu-22.04 runner
          cd src-tauri/target/release/bundle/appimage
          f=$(ls *.AppImage | head -n1)
          test -f "$f.sig"
          mv "$f" "linux-doctor-${VER}-${ARCH}.AppImage"
          mv "$f.sig" "linux-doctor-${VER}-${ARCH}.AppImage.sig"
          ls -la
      # linuxdeploy's runtime lands as AppRun.wrapped with mode 0770, so tools
      # that mount the AppImage as root and drop to a user (Firejail, used by
      # AppImageHub) hit "Permission denied". Repack with 0755 and re-sign.
      - name: Make AppRun.wrapped world-executable and re-sign
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          sudo apt-get install -y -q squashfs-tools >/dev/null
          cd src-tauri/target/release/bundle/appimage
          app=$(ls *.AppImage | head -n1)
          ./"$app" --appimage-extract >/dev/null
          chmod 755 squashfs-root/AppRun.wrapped
          off=$("./$app" --appimage-offset)
          head -c "$off" "$app" > runtime
          mksquashfs squashfs-root new.squashfs -root-owned -noappend -quiet -comp zstd
          cat runtime new.squashfs > fixed.AppImage
          chmod 755 fixed.AppImage
          rm -rf squashfs-root new.squashfs runtime
          mv -f fixed.AppImage "$app"
          npx tauri signer sign -k "$TAURI_SIGNING_PRIVATE_KEY" -p "$TAURI_SIGNING_PRIVATE_KEY_PASSWORD" "$app"
          ls -la
      - name: Build the updater manifest (latest.json)
        run: |
          set -euo pipefail
          TAG=${GITHUB_REF#refs/tags/}
          VER=${TAG#v}
          node scripts/make-latest-json.mjs \
            src-tauri/target/release/bundle \
            "$VER" "$TAG" "${{ github.repository }}"
      - name: Verify the updater signature matches the embedded public key
        run: |
          set -euo pipefail
          PUBKEY=$(node -e "console.log(require('./src-tauri/tauri.conf.json').plugins.updater.pubkey)")
          APPIMAGE=$(ls src-tauri/target/release/bundle/appimage/*.AppImage | head -n1)
          node scripts/verify-updater-signature.mjs \
            "$PUBKEY" "$APPIMAGE.sig" "$APPIMAGE" src-tauri/target/release/bundle/latest.json
      - name: Verify the bundled Node runtime is inside the packages
        run: |
          set -euo pipefail
          # Extract the deb and locate the bundled interpreter instead of
          # assuming its exact path/prefix (the tar member path varies).
          DEB=$(ls src-tauri/target/release/bundle/deb/*.deb | head -n1)
          rm -rf /tmp/debroot && mkdir -p /tmp/debroot
          dpkg-deb -x "$DEB" /tmp/debroot
          NODE=$(find /tmp/debroot -type f -path '*runtime/node' | head -n1)
          test -n "$NODE"
          chmod +x "$NODE"
          "$NODE" --version
          sudo apt-get install -y -q rpm >/dev/null
          RPM=$(ls src-tauri/target/release/bundle/rpm/*.rpm | head -n1)
          rpm -qlp "$RPM" | grep -q "runtime/node"
          echo "✓ runtime/node present and runnable in deb + rpm"
      - name: Collect artifacts
        run: |
          mkdir -p dist
          find src-tauri/target/release/bundle -type f \( \
            -name "*.AppImage" -o -name "*.deb" -o -name "*.rpm" \
            -o -name "*.sig" -o -name "latest.json" \) -exec cp {} dist/ \;
          # Tauri already names outputs with the version; only normalize
          # spaces ("Linux Doctor_x.y.z_amd64") so upload keeps them sane.
          cd dist
          for f in *\ *; do [ -e "$f" ] && mv "$f" "${f// /.}"; done
          ls -la
      - name: Generate SHA256SUMS for bundles
        run: |
          set -x
          ls -lh dist/
          sha256sum dist/* > dist/SHA256SUMS-bundles.txt && cat dist/SHA256SUMS-bundles.txt
          ls -lh dist/
      - name: Attest bundle provenance (SLSA L2)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: dist/*
      - name: Attach bundles to the release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          files: dist/*
          generate_release_notes: false

  # npm registry publish with Sigstore provenance (OIDC trusted publishing).
  # Requires: npmjs.com > Package > Trusted Publishers > GitHub Actions (repo + workflow + environment)
  # GA 2025-07-31: no NPM_TOKEN needed, provenance auto-emitted with id-token.
  # Kept as opt-in — remove `if: false` when trusted publisher is configured.
  npm-publish:
    name: npm publish --provenance
    runs-on: ubuntu-latest
    needs: cli
    if: false # set to `startsWith(github.ref, 'refs/tags/v')` after configuring trusted publisher
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
      - run: npm ci --omit=dev
      - run: npm publish --provenance --access public
