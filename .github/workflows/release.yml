name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

# One release at a time per ref; a manual run never cancels a tag release.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

# Least privilege by default: only the two build jobs that publish/attest
# get write scopes (below). A manual dispatch therefore cannot publish —
# its release/attest steps are also tag-gated.
permissions:
  contents: read

jobs:
  # CLI: test, pack the npm tarball, create the release with it.
  cli:
    name: CLI tarball ${{ github.ref_name }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci --omit=dev
      - run: npm test
      - name: Build the publishable tarball
        run: |
          set -x
          node --version && npm --version
          mkdir -p rel
          npm pack --pack-destination rel
          ls -la rel
      - name: Generate SHA256SUMS for tarball
        run: |
          set -x
          ls -lh rel/
          sha256sum rel/*.tgz > rel/SHA256SUMS && cat rel/SHA256SUMS
          ls -lh rel/
      - name: Attest tarball provenance (SLSA L2)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: rel/*
      - name: Extract changelog for this tag
        run: |
          TAG=${GITHUB_REF#refs/tags/}
          TAG=${TAG#v}
          awk -v tag="## [$TAG]" 'index($0, tag) {p=1; next} /^## \[/ {p=0} p' CHANGELOG.md > /tmp/notes.md
          echo "--- Notes for $TAG ---"; cat /tmp/notes.md
          test -s /tmp/notes.md || echo "No changelog entry for $TAG" > /tmp/notes.md
      - name: Create the GitHub release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          files: rel/*
          body_path: /tmp/notes.md
          generate_release_notes: false

  # The AppImage bundles the build host's WebKitGTK, and only Fedora's build of
  # it renders on a current Mesa. WebKit's PlatformDisplay calls CRASH() when it
  # cannot get an EGL display: the Ubuntu builds tried (2.44 on 22.04, 2.52.6 on
  # 24.04) both come up blank and leave SIGABRT cores, while Fedora's 2.54.1
  # renders the same page on the same host, session and GPU. See
  # internal/egl-investigation-2026-10-26.md.
  gui-appimage:
    name: AppImage ${{ github.ref_name }}
    runs-on: ubuntu-latest
    container: fedora:44
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      # The container has neither git (for checkout) nor Node, and setup-node
      # does not work inside a container job — install both from dnf.
      - name: Install git and Node
        run: dnf install -y --setopt=install_weak_deps=False git nodejs npm
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # Dev deps are needed here: @tauri-apps/cli drives the build.
      - run: npm ci
      - run: npm run build:gui
      - name: Install Tauri system dependencies
        run: |
          dnf install -y --setopt=install_weak_deps=False \
            webkit2gtk4.1-devel \
            gtk3-devel \
            libappindicator-gtk3-devel \
            librsvg2-devel \
            openssl-devel \
            squashfs-tools \
            fuse fuse-libs \
            patchelf \
            file \
            curl wget \
            binutils zlib-devel \
            gcc gcc-c++ make
      # In a container job $HOME is /github/home while the effective user is
      # root with /root, and rustup refuses that mismatch ("you may be using
      # sudo"). Point HOME at the real home before any rustup step.
      - name: Point HOME at the container's root home
        run: echo "HOME=/root" >> "$GITHUB_ENV"
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
      - uses: swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          workspaces: src-tauri
      # Ship a Node runtime inside the package so end users need nothing on
      # their PATH (lib.rs resolves <resources>/runtime/node first).
      - name: Bundle the Node runtime into the package
        run: node scripts/fetch-node-runtime.mjs
      - name: Verify the updater signing key is configured
        env:
          KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        run: |
          if [ -z "$KEY" ]; then
            echo "::error::TAURI_SIGNING_PRIVATE_KEY secret is not set — auto-update artifacts cannot be signed. See docs/RELEASING.md (Auto-update)."
            exit 1
          fi
      - name: Build the AppImage
        run: npx tauri build -v --bundles appimage
        env:
          # Run linuxdeploy without FUSE — removes runner-to-runner variance.
          APPIMAGE_EXTRACT_AND_RUN: "1"
          # linuxdeploy ships binutils 2.35, which cannot read the DT_RELR
          # sections Fedora 44 builds into its libraries ("unknown type [0x13]
          # section '.relr.dyn'"), and treats that as fatal. NO_STRIP is its own
          # escape hatch; an unstripped AppImage costs size, not correctness.
          NO_STRIP: "1"
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
      - name: Upload the AppImage for testing
        # A workflow_dispatch run has no tag, so the steps that rename, sign for
        # the catalog and attach to a release are skipped. Upload the raw bundle
        # so a branch build can be tested before it ships.
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: appimage-${{ github.sha }}
          path: src-tauri/target/release/bundle/appimage/*.AppImage*
          if-no-files-found: error
      # AppImageHub (and other catalogs) expect <repo>-<version>-<arch>.AppImage,
      # so rename Tauri's "<Product>_<version>_<arch>.AppImage" before the
      # manifest is built — latest.json and the .sig follow the new name.
      - name: Rename the AppImage to the catalog convention
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          set -euo pipefail
          VER=${GITHUB_REF#refs/tags/}; VER=${VER#v}
          ARCH=$(uname -m)
          cd src-tauri/target/release/bundle/appimage
          f=$(ls *.AppImage | head -n1)
          test -f "$f.sig"
          mv "$f" "linux-doctor-${VER}-${ARCH}.AppImage"
          mv "$f.sig" "linux-doctor-${VER}-${ARCH}.AppImage.sig"
          ls -la
      # linuxdeploy's runtime lands as AppRun.wrapped with mode 0770, so tools
      # that mount the AppImage as root and drop to a user (Firejail, used by
      # AppImageHub) hit "Permission denied". Repack with 0755 and re-sign.
      - name: Make AppRun.wrapped world-executable and re-sign
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          dnf install -y -q squashfs-tools >/dev/null 2>&1 || true
          cd src-tauri/target/release/bundle/appimage
          app=$(ls *.AppImage | head -n1)
          ./"$app" --appimage-extract >/dev/null
          chmod 755 squashfs-root/AppRun.wrapped
          off=$("./$app" --appimage-offset)
          head -c "$off" "$app" > runtime
          mksquashfs squashfs-root new.squashfs -root-owned -noappend -quiet -comp zstd
          cat runtime new.squashfs > fixed.AppImage
          chmod 755 fixed.AppImage
          rm -rf squashfs-root new.squashfs runtime
          mv -f fixed.AppImage "$app"
          npx tauri signer sign -k "$TAURI_SIGNING_PRIVATE_KEY" -p "$TAURI_SIGNING_PRIVATE_KEY_PASSWORD" "$app"
          ls -la
      - name: Build the updater manifest (latest.json)
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          set -euo pipefail
          TAG=${GITHUB_REF#refs/tags/}
          VER=${TAG#v}
          node scripts/make-latest-json.mjs \
            src-tauri/target/release/bundle \
            "$VER" "$TAG" "${{ github.repository }}"
      - name: Verify the updater signature matches the embedded public key
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          set -euo pipefail
          PUBKEY=$(node -e "console.log(require('./src-tauri/tauri.conf.json').plugins.updater.pubkey)")
          APPIMAGE=$(ls src-tauri/target/release/bundle/appimage/*.AppImage | head -n1)
          node scripts/verify-updater-signature.mjs \
            "$PUBKEY" "$APPIMAGE.sig" "$APPIMAGE" src-tauri/target/release/bundle/latest.json
      - name: Collect the AppImage artifacts
        run: |
          mkdir -p dist-appimage
          find src-tauri/target/release/bundle -type f \( \
            -name "*.AppImage" -o -name "*.sig" -o -name "latest.json" \) \
            -exec cp {} dist-appimage/ \;
          cd dist-appimage
          for f in *\ *; do [ -e "$f" ] && mv "$f" "${f// /.}"; done
          ls -la
      - name: Upload the AppImage artifacts
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: gui-appimage
          path: dist-appimage/
          if-no-files-found: error
      - name: Attest AppImage provenance (SLSA L2)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: dist-appimage/*
      - name: Attach the AppImage to the release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          files: dist-appimage/*
          generate_release_notes: false

  # The .deb and .rpm stay on Ubuntu: built on Fedora they declare
  # `libappindicator3-1` — the deprecated package — instead of the
  # `libayatana-appindicator3-1` that Debian and Ubuntu actually ship, so the
  # package would not install where it is meant to. Measured both ways.
  gui-deb-rpm:
    name: deb + rpm ${{ github.ref_name }}
    runs-on: ubuntu-22.04
    needs: gui-appimage
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      # Dev deps are needed here: @tauri-apps/cli drives the build.
      - run: npm ci
      - run: npm run build:gui
      - name: Install Tauri system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf \
            file
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
      - uses: swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          workspaces: src-tauri
      - name: Bundle the Node runtime into the packages
        run: node scripts/fetch-node-runtime.mjs
      - name: Verify the updater signing key is configured
        env:
          KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        run: |
          if [ -z "$KEY" ]; then
            echo "::error::TAURI_SIGNING_PRIVATE_KEY secret is not set — auto-update artifacts cannot be signed. See docs/RELEASING.md (Auto-update)."
            exit 1
          fi
      - name: Build the deb and rpm
        run: npx tauri build --bundles deb,rpm
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
      - name: Verify the bundled Node runtime is inside the packages
        run: |
          set -euo pipefail
          # Extract the deb and locate the bundled interpreter instead of
          # assuming its exact path/prefix (the tar member path varies).
          DEB=$(ls src-tauri/target/release/bundle/deb/*.deb | head -n1)
          rm -rf /tmp/debroot && mkdir -p /tmp/debroot
          dpkg-deb -x "$DEB" /tmp/debroot
          NODE=$(find /tmp/debroot -type f -path '*runtime/node' | head -n1)
          test -n "$NODE"
          chmod +x "$NODE"
          "$NODE" --version
          sudo apt-get install -y -q rpm >/dev/null
          RPM=$(ls src-tauri/target/release/bundle/rpm/*.rpm | head -n1)
          rpm -qlp "$RPM" | grep -q "runtime/node"
          echo "✓ runtime/node present and runnable in deb + rpm"
      - name: Collect the deb and rpm artifacts
        run: |
          mkdir -p dist
          find src-tauri/target/release/bundle -type f \( \
            -name "*.deb" -o -name "*.rpm" -o -name "*.sig" \) -exec cp {} dist/ \;
          cd dist
          for f in *\ *; do [ -e "$f" ] && mv "$f" "${f// /.}"; done
          ls -la
      - name: Upload the deb and rpm for testing
        # Same reason as the AppImage job's test upload: a dispatch run has no
        # tag, so the release steps are skipped and the only way to inspect the
        # packages is to fetch them as an artifact.
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: deb-rpm-${{ github.sha }}
          path: dist/*
          if-no-files-found: error
      - name: Fetch the AppImage artifacts for the combined checksums
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: gui-appimage
          path: dist
      - name: Generate SHA256SUMS for bundles
        run: |
          set -x
          ls -lh dist/
          sha256sum dist/* > dist/SHA256SUMS-bundles.txt && cat dist/SHA256SUMS-bundles.txt
          ls -lh dist/
      - name: Attest deb and rpm provenance (SLSA L2)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: dist/*.deb
      - name: Attach the deb and rpm to the release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          files: dist/*
          generate_release_notes: false

  # npm registry publish with Sigstore provenance (OIDC trusted publishing).
  # Requires: npmjs.com > Package > Trusted Publishers > GitHub Actions (repo + workflow + environment)
  # GA 2025-07-31: no NPM_TOKEN needed, provenance auto-emitted with id-token.
  # Kept as opt-in — remove `if: false` when trusted publisher is configured.
  npm-publish:
    name: npm publish --provenance
    runs-on: ubuntu-latest
    needs: cli
    if: false # set to `startsWith(github.ref, 'refs/tags/v')` after configuring trusted publisher
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
      - run: npm ci --omit=dev
      - run: npm publish --provenance --access public
