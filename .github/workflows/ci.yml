name: CI

on:
  push:
    branches: [main]
  pull_request:

# Superseded runs on the same branch are cancelled — fast pushes stay cheap.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # First line of defense: a workflow file that fails to parse shows up as
  # "failure with zero jobs" on GitHub, which reads as a mystery. This job
  # names the problem in seconds instead (python3+yaml ship with the runner).
  workflow-lint:
    name: Workflow files parse
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Every .github/workflows/*.yml must be valid YAML
        run: |
          python3 - <<'EOF'
          import glob, sys, yaml
          bad = []
          for f in sorted(glob.glob(".github/workflows/*.yml")):
              try:
                  yaml.safe_load(open(f, encoding="utf-8"))
                  print("ok  ", f)
              except Exception as e:
                  bad.append(f)
                  print(f"FAIL {f}\n     {e}")
          if bad:
              sys.exit(f"invalid workflow files: {', '.join(bad)}")
          EOF

  test:
    name: Tests (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: workflow-lint
    strategy:
      fail-fast: false
      matrix:
        node: [20, 22, 24]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      # The runtime has zero dependencies; installing only prod deps installs
      # nothing at all and still runs the full suite (dev-only tauri CLI is
      # not needed for tests).
      - run: npm ci --omit=dev
      - run: npm test
      # Packaging gate: the tarball must ship every file the runtime reads.
      # src/web.js imports ../src-gui/index.html at load time — if it is
      # missing from the published package, the CLI crashes on every run.
      - name: Packaging gate
        run: npm pack --dry-run 2>&1 | grep -q "src-gui/index.html"
      # The dashboard bundle is committed and read by web.js/--html. All GUI
      # tests read that artifact, so a src-gui edit without a rebuild would
      # otherwise pass CI silently. One matrix leg is enough.
      - name: Dashboard bundle is up to date
        if: matrix.node == 22
        run: |
          npm run build:gui
          git diff --exit-code -- src-gui/index.html

  # A second, closer-to-real system: Node on Fedora, running the same suite
  # (the CLI tests spawn the real binary against the container's /proc, free,
  # df, ...). Catches distro-specific regressions the ubuntu job cannot.
  test-fedora:
    name: Tests (Fedora container)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: workflow-lint
    container: fedora:latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install Node.js
        run: dnf install -y --setopt=install_weak_deps=False nodejs npm
      - run: npm test
      # The real binary against the container's actual /proc and /sys — a
      # smoke test that every check degrades gracefully instead of throwing.
      # Block scalar (|) on purpose: a plain multi-line scalar breaks the
      # whole workflow's YAML when the script contains ": " sequences.
      - name: Real run must not crash or error
        run: |
          node bin/doctor.js --json > /tmp/report.json || true
          node -e '
            const fs = require("fs");
            const r = JSON.parse(fs.readFileSync("/tmp/report.json", "utf8"));
            if (!r.schemaVersion || !Array.isArray(r.findings)) throw new Error("bad report shape");
            if (r.checkErrors && r.checkErrors.length) throw new Error("checkErrors: " + JSON.stringify(r.checkErrors));
            console.log("ok: " + r.checksRun + " checks ran, " + r.findings.length + " findings");
          '

  # Clean-image baseline gate. Runs the real engine inside distro images and
  # fails if a high/medium finding appears that tests/baseline/<id>.json does not
  # justify. This is the job that catches the whole "check lies about a healthy
  # machine" class: on its first run it found packages/broken reporting "Pacman
  # database has errors" on a clean Arch image, with evidence that read
  # "No database errors have been found!". Codes whose truth depends on the host
  # (memory, load, pending updates) are tolerated by the script, so the gate does
  # not flap with whatever else the runner is doing.
  baseline:
    name: Baseline (${{ matrix.id }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: workflow-lint
    strategy:
      fail-fast: false
      matrix:
        include:
          - id: fedora
            image: fedora:latest
            install: "dnf install -y -q --setopt=install_weak_deps=False nodejs"
          - id: debian
            image: debian:stable-slim
            install: "apt-get update -qq && apt-get install -y -qq nodejs"
          - id: ubuntu
            image: ubuntu:24.04
            install: "apt-get update -qq && apt-get install -y -qq nodejs"
          - id: alpine
            image: alpine:latest
            install: "apk add --no-cache nodejs"
          - id: arch
            image: archlinux:latest
            install: "pacman -Sy --noconfirm --quiet nodejs"
    container: ${{ matrix.image }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install Node.js
        run: ${{ matrix.install }}
      - name: No unjustified high/medium finding on a clean image
        run: node scripts/baseline-gate.mjs tests/baseline/${{ matrix.id }}.json

  test-rust:
    name: Rust tests (Tauri)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: workflow-lint
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install Tauri system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
      - uses: swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          workspaces: src-tauri
      # tauri-build validates bundle.resources at compile time; the bundled
      # Node runtime is fetched only in the release job. A placeholder file
      # keeps the tests/lint compiling — they never launch the app.
      - name: Placeholder for the bundled Node runtime resource
        run: mkdir -p src-tauri/runtime && touch src-tauri/runtime/node
      - name: Rust unit tests (loopback guards, host parsing)
        run: cargo test --manifest-path src-tauri/Cargo.toml

  rust-lint:
    name: Rust lint (fmt + clippy)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: workflow-lint
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install Tauri system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          components: rustfmt, clippy
      - uses: swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          workspaces: src-tauri
      - name: cargo fmt --check
        run: cargo fmt --manifest-path src-tauri/Cargo.toml -- --check
      - name: Placeholder for the bundled Node runtime resource
        run: mkdir -p src-tauri/runtime && touch src-tauri/runtime/node
      - name: cargo clippy (-D warnings)
        run: cargo clippy --manifest-path src-tauri/Cargo.toml --locked --all-targets --all-features -- -D warnings

  audit:
    name: Security audit (npm + cargo)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: workflow-lint
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      - run: npm audit --omit=dev --audit-level=moderate
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
      - uses: swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          workspaces: src-tauri
      - name: Install cargo-audit
        run: cargo install cargo-audit --locked
      - name: cargo audit
        run: cd src-tauri && cargo audit

  # The real binary on a real system: a full run must parse as valid JSON
  # with zero check errors, and --list/--schema must stay healthy. Guards
  # against checks that throw on live systems (missing tools, odd hardware).
  real-run:
    name: Real run (ubuntu runner)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: workflow-lint
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 20
          cache: npm
      - run: npm ci --omit=dev
      - name: Full run → valid JSON, no check errors
        run: |
          node bin/doctor.js --json > /tmp/report.json || true
          node -e '
            const fs = require("fs");
            const r = JSON.parse(fs.readFileSync("/tmp/report.json", "utf8"));
            if (!r.schemaVersion || !Array.isArray(r.findings)) throw new Error("bad report shape");
            if (r.checkErrors && r.checkErrors.length) throw new Error("checkErrors: " + JSON.stringify(r.checkErrors));
            console.log("ok: " + r.checksRun + " checks ran, " + r.findings.length + " findings, score " + r.score);
          '
      - name: --list and --schema stay healthy
        run: |
          node bin/doctor.js --list > /dev/null
          node bin/doctor.js --schema | node -e '
            const s = JSON.parse(require("fs").readFileSync(0, "utf8"));
            if (s.title !== "linux-doctor report") throw new Error("schema changed");
            console.log("ok: schema v" + s.properties.schemaVersion.const);
          '
