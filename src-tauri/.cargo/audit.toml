# cargo-audit reads this when run from src-tauri (CI runs `cd src-tauri && cargo audit`).

[advisories]
# RUSTSEC-2026-0372 (2026-10-16): `zvariant_derive` is unmaintained.
#
# This is a `warning`, not a vulnerability: no CVE, no exploitable defect. It is
# ignored knowingly, with the reasoning written down, rather than by weakening
# the audit:
#
# - it arrives transitively: zvariant <- zbus <- tauri-plugin-single-instance,
#   so it is part of the desktop shell only. The CLI does not link it at all;
# - no version of zvariant avoids it: 5.15.1 still requires zvariant_derive
#   ^5.15.0, and the advisory is crate-level, so pinning or updating does not
#   clear it;
# - zvariant_derive is a proc-macro: it runs at build time and is not part of
#   the shipped binary, so it cannot be reached at runtime.
#
# Drop this line when zbus moves off the crate, or when the desktop shell stops
# using tauri-plugin-single-instance. Re-check with `cargo audit` after either.
ignore = ["RUSTSEC-2026-0372"]
