# Read by `cargo audit` when it runs from src-tauri (CI: `cd src-tauri && cargo audit`).
#
# Only VULNERABILITIES are listed here. cargo-audit already allows `unmaintained`
# and `unsound` warnings without failing, so they are left visible rather than
# silenced.

[advisories]
ignore = [
  # RUSTSEC-2026-0367 (high), RUSTSEC-2026-0368, RUSTSEC-2026-0369 (critical):
  # unsafe handling in `zip`'s archive extraction (symlink targets outside the
  # destination, SUID/SGID bits preserved, Unix permissions applied through
  # symlinks). Fixed upstream in zip >= 9.0.0.
  #
  # zip is pinned to ^4 by tauri-plugin-updater, and every published version
  # still requires it — 2.11, 2.12, 2.13, 2.14 and 3.0.0-alpha.3 (checked on
  # crates.io). There is no version of the plugin that allows zip 9, so this
  # cannot be fixed in this repo, and a [patch] to zip 9 would not compile
  # against the plugin's API.
  #
  # Reachability, verified in tauri-plugin-updater 2.11.0 source (not assumed):
  #
  #   1. ZipArchive::extract is only reached from `impl Update` -> install_inner
  #      -> extract -> extract_zip, and that whole impl is `#[cfg(windows)]`.
  #      On Linux — the only target this project builds and ships — the crate
  #      sits in Cargo.lock but the code is never compiled.
  #   2. Even on Windows the bytes are not untrusted: updater.rs verifies the
  #      downloaded buffer with minisign (`verify_signature` against the pubkey
  #      embedded in tauri.conf.json) BEFORE returning it, and install/extract
  #      only ever sees that verified buffer.
  #
  # Residual risk: a Windows build, fed a malicious archive that also carries a
  # valid minisign signature for the embedded key. Not reachable by a third
  # party, and not present in any artifact published today.
  #
  # Remove this the moment tauri-plugin-updater allows zip >= 9 — and re-check
  # before ever shipping a Windows bundle.
  "RUSTSEC-2026-0367",
  "RUSTSEC-2026-0368",
  "RUSTSEC-2026-0369",
]
