# Read by `cargo audit` when it runs from src-tauri (CI: `cd src-tauri && cargo audit`).
#
# These three are accepted knowingly, each with the reason written down. None is
# a vulnerability: two are "unmaintained" warnings and one is an unsoundness in
# a dependency we cannot move. Everything else still fails the audit.

[advisories]
ignore = [
  # RUSTSEC-2026-0372 — `zvariant_derive` is unmaintained (warning).
  # Arrives transitively: zvariant <- zbus <- tauri-plugin-single-instance, so
  # only the desktop shell, never the CLI. No version of zvariant avoids it
  # (5.15.1 still requires zvariant_derive ^5.15.0). It is a proc-macro: it
  # runs at build time and is not part of the shipped binary.
  "RUSTSEC-2026-0372",

  # RUSTSEC-2026-0370 — `zvariant` is unmaintained (warning).
  # Same chain, same reason. zbus is pulled in by tauri-plugin-single-instance.
  "RUSTSEC-2026-0370",

  # RUSTSEC-2024-0429 — `glib 0.18.5` unsoundness in its Iterator impls.
  # Not fixable here: glib is pinned to 0.18 by gtk 0.18, which comes from
  # libappindicator <- tray-icon <- tauri. gtk-rs is at 0.22 upstream, but
  # moving requires tray-icon/libappindicator to adopt it. Forcing the bump
  # breaks the GTK stack used for the tray icon.
  #
  # This one should disappear on its own when tauri ships a tray-icon built on
  # a newer gtk-rs. Remove the line then and re-run the audit.
  "RUSTSEC-2024-0429",
]
