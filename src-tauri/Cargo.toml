[package]
name = "linux-doctor"
version = "0.7.2"
description = "Linux Doctor desktop app — read-only health checks for your Linux system"
edition = "2021"

# The Rust side is intentionally a thin shell: all check logic lives in the
# Node CLI (bin/doctor.js), which the app runs and renders. No duplication.
[lib]
name = "linux_doctor_lib"
crate-type = ["lib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["custom-protocol", "devtools", "tray-icon"] }
tauri-plugin-single-instance = "2"
tauri-plugin-autostart = "2"
tauri-plugin-updater = "2"
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
